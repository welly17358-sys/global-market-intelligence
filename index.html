<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Global Market Intelligence</title><style>
:root{font-family:system-ui,"Noto Sans TC",sans-serif;color:#18273b;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}header{background:#102943;color:white;padding:28px max(20px,calc((100vw - 1100px)/2))}header h1{margin:0 0 8px;font-size:26px}header p{margin:0;color:#d5e3f1}main{max-width:1100px;margin:auto;padding:22px 18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat,.panel{background:white;border:1px solid #e0e6ed;border-radius:12px;padding:18px}.stat strong{display:block;font-size:23px;margin-top:6px}.muted{color:#64748b;font-size:13px}.tabs{display:flex;gap:8px;margin:24px 0;flex-wrap:wrap}button{border:1px solid #c9d5e2;background:white;border-radius:9px;padding:10px 15px;cursor:pointer}button.active{background:#153d66;color:white}.panel{margin-bottom:14px}.item{border-bottom:1px solid #e7ebf0;padding:14px 0}.item:last-child{border:0}.item a{color:#164c83;text-decoration:none;font-weight:600}.item small{display:block;margin-top:6px;color:#718096}input{padding:10px;border:1px solid #c9d5e2;border-radius:8px;width:100%;max-width:340px}.notice{padding:12px;border-radius:8px;background:#fff7e6;color:#805b1d;margin:12px 0}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:10px;border-bottom:1px solid #e5eaf0}th{font-size:13px;color:#64748b}@media(max-width:650px){.stats{grid-template-columns:1fr}header h1{font-size:21px}}
</style></head><body><header><h1>Global Market Intelligence</h1><p>全球金融情報 × 台股資料分析｜V1.6 原型</p></header><main><div class="stats"><div class="stat">新聞筆數<strong id="newsCount">—</strong></div><div class="stat">股票行情筆數<strong id="stockCount">—</strong></div><div class="stat">最新同步狀態<strong id="syncStatus">—</strong></div></div><div id="notice" class="notice">讀取中…</div><nav class="tabs"><button class="active" data-tab="news">全球新聞</button><button data-tab="stocks">台股行情</button><button data-tab="mops">MOPS 公告</button><button data-tab="status">資料更新</button></nav><section class="panel"><div id="content">載入中…</div></section><p class="muted">新聞與行情僅供研究，不構成投資建議。資料可能延遲；請以原始來源為準。</p></main><script src="config.js"></script><script type="module" src="site.js"></script></body></html>
